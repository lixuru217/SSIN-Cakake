services:
  leo2:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    container_name: leo2
    command:
      - python
      - /app/app/guo2021_new_satellite.py
      - --context
      - /shared/offline_context_guo.pkl
      - --bind
      - 0.0.0.0
      - --port
      - "5000"
      - --old-host
      - leo1
      - --old-port
      - "6000"
    volumes:
      - ./shared:/shared
    networks:
      ue_leo_net:
      isl_net:
    cap_add:
      - NET_ADMIN

  leo1:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    container_name: leo1
    command:
      - python
      - /app/app/guo2021_old_satellite.py
      - --context
      - /shared/offline_context_guo.pkl
      - --bind
      - 0.0.0.0
      - --port
      - "6000"
      - --new-host
      - leo2
      - --new-port
      - "5000"
      - --ground-host
      - ground
      - --ground-port
      - "7000"
    volumes:
      - ./shared:/shared
    networks:
      ue_leo1_net:
      isl_net:
    cap_add:
      - NET_ADMIN

  ground:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    container_name: ground
    command:
      - python
      - /app/app/guo2021_ground.py
      - --context
      - /shared/offline_context_guo.pkl
      - --bind
      - 0.0.0.0
      - --port
      - "7000"
      - --sat-host
      - leo1
      - --sat-port
      - "6000"
    volumes:
      - ./shared:/shared
    networks:
      isl_net:
    cap_add:
      - NET_ADMIN

  ue:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    container_name: ue
    command: ["sleep", "infinity"]
    volumes:
      - ./shared:/shared
    networks:
      ue_leo_net:
      ue_leo1_net:
    cap_add:
      - NET_ADMIN

networks:
  ue_leo_net:
  ue_leo1_net:
  isl_net:
